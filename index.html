<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beantown Hub — Boston Scores</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Beantown Hub</h1>
</header>

<div class="wrap">

  <div id="home-screen" class="screen active">
    <div class="ticker" id="ticker">
      <div class="ticker-track" id="tickerTrack">
        <span class="ticker-item">Loading scores…</span>
      </div>
    </div>
    <div class="launcher-grid" id="launcherGrid"></div>
  </div>

  <div id="team-screen" class="screen">
    <button class="back-btn" id="backBtn">← All Teams</button>
    <div id="teamHeader"></div>
    <div id="teamSections"></div>
  </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
