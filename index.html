<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Pitch — MLB Scores</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span class="ball">⚾</span><h1>First Pitch</h1></div>
    <p>Tap a team's star to follow them. Tap a game to see highlights.</p>
  </header>

  <div class="teambar" id="teambar"></div>

  <div class="filterbar">
    <label class="toggle">
      <input type="checkbox" id="myTeamsToggle">
      Show only my teams
    </label>
    <span class="hint" id="favCount"></span>
  </div>

  <div id="sections"></div>

</div>

<script src="js/app.js"></script>
</body>
</html>
